<title>DOTO Army</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800;900&family=Chakra+Petch:wght@600;700&display=swap">
<style>
/* Layout: full-screen 3D world; glass HUD at the edges — wallet & stats top, quest under it, minimap corner, joystick left thumb, actions right thumb. Single dark brand world. */
:root{
  --ink:#040604;
  --glass:rgba(12,16,13,.74);
  --glass-2:rgba(18,23,19,.92);
  --line:rgba(225,240,228,.14);
  --text:#eef2ef;
  --muted:#93a097;
  --green:#4dd054;
  --gold:#f2c14e;
  --bad:#ff4b3e;
  --f-body:"Vazirmatn",Tahoma,"Segoe UI",sans-serif;
  --f-mark:"Chakra Petch","Vazirmatn",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--text);font-family:var(--f-body);margin:0;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font-family:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--green);outline-offset:2px}
#stage{position:fixed;inset:0;touch-action:none}
#stage canvas{display:block;width:100%;height:100%}
.hud{position:fixed;inset:0;pointer-events:none;direction:rtl;z-index:2}
.top{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);right:max(12px,env(safe-area-inset-right,0px));left:max(12px,env(safe-area-inset-left,0px));display:flex;gap:8px;align-items:flex-start}
.col{display:flex;flex-direction:column;gap:7px;flex:1;min-width:0}
.stats{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:14px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-weight:800;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill svg{width:18px;height:18px;flex:none}
.pill small{font-weight:600;color:var(--muted);font-size:10.5px}
.pill.me img{width:24px;height:24px;border-radius:50%;display:block}
.lvlring{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--green) calc(var(--p)*1%),#26302a 0)}
.lvlring img{width:24px;height:24px}
.mark{font-family:var(--f-mark);font-weight:700;letter-spacing:.05em;direction:ltr}
.mark b{color:var(--green)}
.wallet{border-color:rgba(77,208,84,.45);gap:8px}
.wallet .slots{display:flex;gap:3px;direction:ltr}
.wallet .slots i{width:9px;height:14px;border-radius:3px;background:#1d241e;border:1px solid rgba(225,240,228,.12)}
.wallet .slots i.f{background:var(--green);box-shadow:0 0 6px var(--green);border-color:transparent}
.wallet.full{border-color:var(--gold)}
.shield{color:var(--green)}
.quest{align-self:flex-start;max-width:min(66vw,330px);padding:9px 12px;border-radius:14px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;flex-direction:column;gap:5px;font-size:12px}
.quest h3{margin:0;font-size:11px;font-weight:800;color:var(--green)}
.qs{display:flex;align-items:center;gap:7px;color:var(--muted);font-weight:600}
.qs b{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;border:1px solid var(--line);flex:none}
.qs.now{color:var(--text);font-weight:800}
.qs.now b{background:var(--green);color:#052008;border-color:transparent;box-shadow:0 0 8px var(--green)}
.qs.done{color:var(--green)}
.qs.done b{border-color:var(--green)}
.qs.alert{color:#ff8a80;font-weight:800}
.qs.alert b{border-color:#ff8a80}
.dots{display:flex;gap:5px;direction:rtl}.dots i{width:16px;height:4px;border-radius:9px;background:#28302a}.dots i.d{background:#2f8a36}.dots i.n{background:var(--green);box-shadow:0 0 6px var(--green)}
.qbar{height:4px;border-radius:9px;background:#1b211c;overflow:hidden;margin-top:2px}
.qbar i{display:block;height:100%;background:var(--green);box-shadow:0 0 8px var(--green);transition:width .4s}
.side{display:flex;flex-direction:column;gap:8px;align-items:flex-end;flex:none}
#mini{width:112px;height:112px;border-radius:18px;background:var(--glass);border:1px solid var(--line)}
.sbtn{pointer-events:auto;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(10px);border-radius:14px;padding:7px 11px;font-size:12px;font-weight:800;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap}
.sbtn svg{width:16px;height:16px}
.sbtn.shop{border-color:rgba(77,208,84,.5);color:var(--green)}
.joy{pointer-events:auto;position:absolute;left:0;bottom:0;width:48%;height:44%;touch-action:none}
.joyBase{position:absolute;width:120px;height:120px;border-radius:50%;border:1.5px solid rgba(225,240,228,.22);background:radial-gradient(circle,rgba(77,208,84,.10),rgba(10,14,11,.55));left:max(24px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 30px)}
.joyKnob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:linear-gradient(160deg,#f4f7f5,#8d958f);box-shadow:0 0 16px rgba(77,208,84,.5),inset 0 0 0 2px rgba(77,208,84,.65)}
.acts{pointer-events:auto;position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 24px);display:flex;gap:10px;align-items:flex-end;direction:ltr}
.stack{display:flex;flex-direction:column;gap:10px;align-items:center}
.btn{border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(10px);border-radius:50%;width:60px;height:60px;display:grid;place-items:center;font-size:11px;font-weight:800;cursor:pointer;touch-action:none;text-align:center;line-height:1.25;padding:4px}
.btn svg{width:24px;height:24px}
.btn.main{width:92px;height:92px;font-size:13px;background:radial-gradient(circle at 35% 30%,#7ff085,var(--green) 60%,#2f9a35);color:#052008;border-color:transparent;box-shadow:0 0 26px rgba(77,208,84,.55)}
.btn.main[disabled]{background:var(--glass);color:var(--muted);box-shadow:none;border-color:var(--line)}
.btn.main.warn{background:radial-gradient(circle at 35% 30%,#ff8a80,var(--bad) 60%,#a3241b);color:#fff;box-shadow:0 0 26px rgba(255,75,62,.55)}
.btn.main.nudge{animation:nudge .45s ease-out}@keyframes nudge{0%,100%{transform:scale(1)}30%{transform:scale(1.16)}60%{transform:scale(.95)}}
.btn.main.full{border-color:var(--gold);color:var(--gold);animation:pulseGold 1.1s ease-in-out infinite}
@keyframes pulseGold{50%{box-shadow:0 0 26px rgba(242,193,78,.6)}}
.btn.on{border-color:var(--green);color:var(--green);box-shadow:0 0 14px rgba(77,208,84,.45)}
.btn.sw{width:46px;height:46px}
.btn.sw i{width:22px;height:22px;border-radius:5px;display:block}
.banner{position:absolute;top:38%;left:50%;transform:translate(-50%,-50%);text-align:center;padding:14px 22px;border-radius:20px;background:var(--glass-2);border:1px solid var(--green);box-shadow:0 0 40px rgba(77,208,84,.3);min-width:220px;max-width:88vw;animation:pop .35s ease-out}
.banner.bad{border-color:var(--bad);box-shadow:0 0 40px rgba(255,75,62,.3)}
.banner h2{margin:0 0 4px;font-size:19px;font-weight:900}
.banner p{margin:0;font-size:12.5px;color:var(--muted);font-weight:700}
.banner .big{font-size:15px;color:var(--green);font-weight:900;margin-top:4px}
.banner.bad .big{color:var(--bad)}
@keyframes pop{from{transform:translate(-50%,-50%) scale(.85);opacity:0}}
.toasts{position:fixed;top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 206px);left:50%;transform:translateX(-50%);z-index:5;display:flex;flex-direction:column;gap:6px;width:min(86vw,380px);pointer-events:none;direction:rtl;align-items:center}
.toast{background:rgba(10,14,11,.92);border:1px solid rgba(77,208,84,.45);border-radius:14px;padding:8px 12px;font-size:13px;font-weight:700;animation:tin .25s ease-out;text-align:center}
.toast.bad{border-color:rgba(255,75,62,.65)}
@keyframes tin{from{transform:translateY(-8px);opacity:0}}
.scrim{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;direction:rtl}
.scrim.center{align-items:center;padding:16px}
.sheet{width:100%;max-width:540px;max-height:84%;overflow:auto;background:radial-gradient(120% 60% at 0% 100%,rgba(77,208,84,.14),transparent 60%),#0f130f;border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;flex-direction:column;gap:12px}
.card{width:100%;max-width:440px;max-height:90%;overflow:auto;background:radial-gradient(120% 60% at 0% 100%,rgba(77,208,84,.16),transparent 60%),#0f130f;border:1px solid var(--line);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:14px}
.sh{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sh h2{margin:0;font-size:18px;font-weight:900}
.sh .sub{font-size:12px;color:var(--muted);font-weight:600}
.x{border:1px solid var(--line);background:transparent;border-radius:99px;width:34px;height:34px;cursor:pointer;font-size:16px;flex:none}
.bal{display:flex;gap:8px;flex-wrap:wrap}
.items{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.item{border:1px solid var(--line);background:#151a16;border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:7px;min-width:0;text-align:right;cursor:pointer;position:relative;overflow:hidden}
.item::after{content:"";position:absolute;inset:auto -30% -60% auto;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,rgba(77,208,84,.18),transparent 70%);pointer-events:none}
.item[disabled]{cursor:not-allowed}
.item[disabled] .buy{opacity:.45}
.item .ico{width:46px;height:46px;border-radius:14px;background:linear-gradient(160deg,#20271f,#0b0e0b);border:1px solid rgba(77,208,84,.35);display:grid;place-items:center}
.item .ico svg{width:28px;height:28px}
.item b{font-size:14px;font-weight:900}
.item small{font-size:11px;color:var(--muted);line-height:1.6;font-weight:500}
.buy{font-size:12.5px;font-weight:900;color:var(--green);font-variant-numeric:tabular-nums}
.buy.no{color:var(--bad)}
.owned{font-size:11px;font-weight:900;color:#052008;background:var(--green);border-radius:99px;padding:2px 9px;align-self:flex-start}
.wide{grid-column:1/-1}
.sec{font-size:12px;font-weight:900;color:var(--muted);margin-top:4px}
.note{font-size:11px;color:var(--muted);line-height:1.7}
.ghost{border:1px solid var(--line);background:#151a16;border-radius:14px;padding:11px;font-weight:800;cursor:pointer}
.go{border:0;border-radius:16px;padding:14px;font-weight:900;font-size:16px;cursor:pointer;background:var(--green);color:#052008;box-shadow:0 0 22px rgba(77,208,84,.45)}
.steps{display:flex;flex-direction:column;gap:10px}
.hstrip{display:flex;align-items:stretch;gap:4px}.hp{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:10px 6px;border:1px solid var(--line);border-radius:16px;background:#151a16}.hp .ico{width:44px;height:44px;border-radius:12px;background:#0b0e0b;border:1px solid rgba(77,208,84,.35);display:grid;place-items:center}.hp .ico svg{width:28px;height:28px}.hp b{font-size:13.5px;font-weight:900}.hp span{font-size:11px;color:var(--muted);line-height:1.5}.ha{align-self:center;color:var(--green);font-weight:900}
.hwarn{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:14px;border:1px solid rgba(255,196,0,.45);background:rgba(255,196,0,.06);font-size:12px}.hwarn svg{width:26px;height:26px;flex:none}.hwarn b{color:#ffc400}
.hctl{display:flex;gap:6px;flex-wrap:wrap}.hctl span{font-size:11.5px;font-weight:700;padding:5px 10px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.step{display:grid;grid-template-columns:48px 1fr;gap:12px;align-items:center}
.step .ico{width:48px;height:48px;border-radius:14px;background:linear-gradient(160deg,#20271f,#0b0e0b);border:1px solid rgba(77,208,84,.35);display:grid;place-items:center}
.step .ico svg{width:28px;height:28px}
.step b{display:block;font-size:14px;font-weight:900;margin-bottom:2px}
.step span{font-size:12px;color:var(--muted);line-height:1.6}
.loading{position:fixed;inset:0;display:grid;place-items:center;z-index:30;background:radial-gradient(circle at 50% 40%,#0f2a14,#030604 70%);direction:rtl;font-weight:800;color:var(--muted);text-align:center;padding:24px;transition:opacity .5s}
.loading.out{opacity:0;pointer-events:none}
.ttl{display:flex;flex-direction:column;align-items:center;gap:8px}.ttl img{width:150px;filter:drop-shadow(0 0 30px rgba(77,208,84,.45));animation:float 3s ease-in-out infinite}
.logo3d{font-family:var(--f-mark),system-ui,sans-serif;font-size:44px;font-weight:900;letter-spacing:1px;direction:ltr;background:linear-gradient(180deg,#ffffff,#c6cdc9 45%,#6f7773 55%,#e8ecea);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 2px #4dd054) drop-shadow(0 0 16px rgba(77,208,84,.55))}
.tsub{font-size:12px;color:#c7d2ca;letter-spacing:.4px;direction:ltr}
.lbar{width:180px;height:6px;border-radius:9px;background:#0b120d;box-shadow:0 0 0 1.5px #8e9792;overflow:hidden;margin-top:6px}.lbar i{display:block;height:100%;width:40%;background:linear-gradient(90deg,#2c9a33,#8dff95);animation:lb 1.1s ease-in-out infinite}
.tmsg{font-size:11.5px;color:var(--muted)}
@keyframes lb{0%{transform:translateX(-110%)}100%{transform:translateX(280%)}}
@keyframes float{50%{transform:translateY(-6px)}}
/* motion polish */
.sheet{animation:sheetIn .26s cubic-bezier(.2,.9,.3,1.2)}.card{animation:cardIn .24s cubic-bezier(.2,.9,.3,1.25)}
@keyframes sheetIn{from{transform:translateY(40px);opacity:0}}@keyframes cardIn{from{transform:scale(.92);opacity:0}}
.btn,.sbtn,.item,.go,.claim,.qskip{transition:transform .08s ease,filter .15s}
.btn:active,.sbtn:active,.item:active,.go:active,.claim:active,.qskip:active{transform:scale(.94);filter:brightness(1.15)}
.bdg{min-width:17px;height:17px;border-radius:9px;background:var(--bad);color:#fff;font-size:10.5px;display:grid;place-items:center;padding:0 4px;font-weight:900;font-family:var(--f-body)}
.bdg.g{background:var(--gold);color:#1a1200}
.banner.gold{border-color:var(--gold);box-shadow:0 0 44px rgba(242,193,78,.35)}
.banner.gold .big{color:var(--gold)}
.qs.gold{color:var(--gold);font-weight:800}.qs.gold b{border-color:var(--gold)}
.combo{position:absolute;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 196px);display:flex;flex-direction:column;align-items:center;gap:3px;pointer-events:none;direction:rtl}
.combo b{font-size:21px;font-weight:900;color:var(--gold);text-shadow:0 0 14px rgba(242,193,78,.65)}
.combo span{font-size:10.5px;font-weight:800;color:#e9dcb8}
.combo i{display:block;width:74px;height:4px;border-radius:9px;background:var(--gold);box-shadow:0 0 8px var(--gold)}
.combo.on i{animation:cdown 2.6s linear forwards}.combo.on b{animation:cpop .28s ease-out}
@keyframes cdown{to{width:0}}@keyframes cpop{from{transform:scale(1.6)}}
.mrow{display:grid;grid-template-columns:1fr auto;gap:7px 10px;align-items:center;padding:11px 12px;border:1px solid var(--line);border-radius:16px;background:#151a16}
.mrow .mt{display:flex;justify-content:space-between;gap:8px;font-size:13px}.mrow .mt span{color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
.mrow .qbar{grid-column:1}.mrow .claim,.mrow .owned{grid-row:1/3;grid-column:2;align-self:center}
.mrow.got{opacity:.55}
.claim{border:0;border-radius:12px;padding:9px 12px;font-weight:900;font-size:12px;background:var(--green);color:#052008;cursor:pointer;box-shadow:0 0 14px rgba(77,208,84,.4)}
.claim[disabled]{background:#222a23;color:var(--muted);cursor:default;box-shadow:none}
.streak{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.streak div{border:1px solid var(--line);border-radius:12px;padding:7px 2px;text-align:center;font-size:10px;font-weight:800;color:var(--muted);background:#151a16;display:flex;flex-direction:column;gap:2px;line-height:1.3}
.streak div b{font-size:12px}
.streak div.d{border-color:rgba(77,208,84,.5);color:var(--green)}
.streak div.n{background:var(--green);color:#052008;border-color:transparent;box-shadow:0 0 12px rgba(77,208,84,.5)}
.streak div.big{border-color:rgba(242,193,78,.6)}
.wb{display:flex;flex-direction:column;align-items:center;gap:2px;padding:16px;border-radius:18px;background:#151a16;border:1px solid rgba(77,208,84,.4)}
.wb svg{width:42px;height:42px}.wb b{font-size:36px;font-weight:900;color:var(--green);font-variant-numeric:tabular-nums}.wb small{color:var(--muted);font-weight:700}
.gov{border:1px solid rgba(77,208,84,.4);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px;background:#151a16}.gov b{font-size:13.5px}.gov small{color:var(--muted);font-size:11.5px;line-height:1.6}.gov .item{align-items:center;text-align:center;padding:10px}
.heroart{display:block;width:132px;height:auto;margin:-8px auto -14px;filter:drop-shadow(0 0 26px rgba(77,208,84,.35))}
.item.kit{position:relative}.kimg{width:64px;height:64px;border-radius:14px;object-fit:cover;display:block;box-shadow:0 0 0 1.5px #9aa39e,0 0 16px rgba(77,208,84,.35)}.item.kit.own .kimg{box-shadow:0 0 0 2px var(--green),0 0 18px rgba(77,208,84,.6)}
.qskip{pointer-events:auto;align-self:flex-start;border:1px solid var(--gold);background:rgba(242,193,78,.12);color:var(--gold);border-radius:12px;padding:6px 11px;font-weight:900;font-size:12px;cursor:pointer;font-family:inherit}
.rks{display:flex;flex-direction:column;gap:4px}
.rk{display:grid;grid-template-columns:44px 1fr auto;gap:8px;align-items:center;padding:7px 10px;border-radius:12px;background:#151a16;border:1px solid var(--line);font-size:12.5px}
.rk b{color:var(--muted);font-variant-numeric:tabular-nums}.rk span{direction:ltr;text-align:right;font-weight:700}.rk i{font-style:normal;color:var(--muted);font-variant-numeric:tabular-nums;font-size:11.5px}
.rk.cab b{color:var(--green)}.rk.me{border-color:var(--green);background:rgba(77,208,84,.12)}.rk.me span{color:var(--green)}
.rk.gap{background:none;border:0;justify-content:center;display:flex;color:var(--muted);padding:0}
.ghost[disabled]{opacity:.45;cursor:default}
/* chrome skin */
.pill,.quest,.sbtn,.btn:not(.main){border:1.5px solid transparent!important;background:linear-gradient(rgba(12,16,13,.82),rgba(12,16,13,.82)) padding-box,linear-gradient(160deg,#eef2f0,#6f7773 38%,#d3d9d5 62%,#4a514d) border-box!important;box-shadow:inset 0 0 0 1px rgba(77,208,84,.14),0 4px 14px rgba(0,0,0,.45)}
.sbtn.shop{background:linear-gradient(rgba(14,32,17,.88),rgba(14,32,17,.88)) padding-box,linear-gradient(160deg,#eef2f0,#6f7773 38%,#d3d9d5 62%,#4a514d) border-box!important;text-shadow:0 0 8px rgba(77,208,84,.6)}
.go,.claim:not([disabled]){border:2px solid transparent!important;background:linear-gradient(180deg,#58d65e,#2c9a33) padding-box,linear-gradient(160deg,#f3f6f4,#7c8580 40%,#e3e8e5 65%,#55605a) border-box!important;color:#f4fff5!important;text-shadow:0 1px 0 rgba(0,40,6,.7),0 0 10px rgba(180,255,185,.5);letter-spacing:.2px}
.btn.main:not([disabled]){box-shadow:0 0 0 3px #b9c1bc,0 0 0 5px #2a312d,0 0 28px rgba(77,208,84,.55)!important}
#mini{border-radius:50%!important;border:0!important;background:radial-gradient(circle,#0f2a13,#060d08 72%)!important;box-shadow:0 0 0 3px #a9b1ad,0 0 0 5px #1b211d,0 0 0 6px #6f7773,0 0 20px rgba(77,208,84,.35)}
.power{display:flex;align-items:center;gap:8px;width:min(64vw,300px);direction:rtl}
.pw-ic{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none;background:radial-gradient(circle at 35% 30%,#2c4a30,#0b140d);box-shadow:0 0 0 2.5px #b3bbb6,0 0 0 4px #20271f,0 0 16px rgba(77,208,84,.5),inset 0 0 12px rgba(77,208,84,.45)}
.pw-ic svg{width:22px;height:22px;color:var(--green)}

/* ================= SAVE ================= */
function fresh(){ return {v:3, kit:{}, kitTop:true, tdoto:20*U, u100:true, gems:20, doto:800, xp:0, lvl:1, cap:10, sentry:0, rpc:0, hw:false, fw:false, magnetUntil:0, burned:0, burnMs:0, autoBurnUntil:0, blocks:0, scammed:0, bridges:{}, bprog:{}, placed:[], removed:[], pos:null, tut:false, builds:{}, skyNext:0, bossWon:-1, vaultDay:'', wallet:[], pendChests:[], offPending:0, bank:0, daily:null, streak:0, lastDay:'', lastSeen:0, sfx:true, stake:0, node:0, fork:0, fbr:{}, audit:null, day0:Date.now()}; }

  addEventListener('pointerdown', ensure, {passive:true}); addEventListener('keydown', ensure);
  function tone(f, d, type, vol, delay, slide){

const dayKey = ms => { const d = new Date(ms); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); };
const MPOOL = [

const LOGIN = d => ({d: 10*d*U, g: d===3 ? 5 : d===7 ? 20 : 0});

function hash(x,z,s){ let h = (x*374761393 + z*668265263 + s*1442695041)|0; h = Math.imul(h^(h>>>13),1274126177); return ((h^(h>>>16))>>>0)/4294967295; }

/* ================= RENDERER / POST ================= */
const stageEl = $('#stage');

renderer.setPixelRatio(Math.min(COARSE ? 1.35 : 1.75, window.devicePixelRatio||1));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stageEl.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x050907, .014);
const camera = new THREE.PerspectiveCamera(55, 1, .1, 600);
let composer = null, gradePass = null, shake = 0;
try{
  if(THREE.EffectComposer && THREE.UnrealBloomPass && THREE.RenderPass){
    composer = new THREE.EffectComposer(renderer);
    composer.addPass(new THREE.RenderPass(scene, camera));
    composer.addPass(new THREE.UnrealBloomPass(new THREE.Vector2(512,512), .55, .35, .8));
    if(THREE.ShaderPass){
      gradePass = new THREE.ShaderPass({uniforms:{tDiffuse:{value:null}, uFlash:{value:0}, uFlashCol:{value:new THREE.Vector3(1,1,1)}},
        vertexShader:'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }',
        fragmentShader:'uniform sampler2D tDiffuse; uniform float uFlash; uniform vec3 uFlashCol; varying vec2 vUv; void main(){ vec3 c = texture2D(tDiffuse, vUv).rgb;'+
          'c = mix(c, c*c*(3.-2.*c), .3); float l = dot(c, vec3(.299,.587,.114)); c = mix(vec3(l), c, 1.1); c += vec3(.006,.016,.01)*(1.-l);'+
          'c *= mix(.62, 1., 1.-smoothstep(.35, .95, length(vUv-.5))); c = mix(c, uFlashCol, uFlash); gl_FragColor = vec4(c,1.); }'});

function mergeStatic(root, shadow){
  const U = THREE.BufferGeometryUtils;
  root.traverse(o => { if(o.isMesh) o.castShadow = false; });
  if(!U || !U.mergeBufferGeometries) { if(shadow) root.traverse(o => { if(o.isMesh) o.castShadow = true; }); return; }

  groups.forEach(gr => {
    const byMat = new Map();
    gr.children.forEach(c => { if(c.isMesh && !c.userData.dyn && !c.children.length && !Array.isArray(c.material)){ if(!byMat.has(c.material)) byMat.set(c.material, []); byMat.get(c.material).push(c); } });
    byMat.forEach((list, mat) => {
      if(list.length < 2) { list.forEach(m => m.castShadow = shadow); return; }
      try{
        const geos = list.map(m => { m.updateMatrix(); const gg = m.geometry.clone(); gg.applyMatrix4(m.matrix); return gg; });
        const merged = U.mergeBufferGeometries(geos, false); if(!merged) return;
        list.forEach(m => gr.remove(m));
        const mm = new THREE.Mesh(merged, mat); mm.castShadow = shadow; gr.add(mm);
      }catch(e){}
    });
  });
}

function computeCtx(){
  if(buildMode) return {k:'place', t:'بگذار'};
  let v = null, bd = 3.2; validators.forEach(x => { if(!x.mine || x.status==='on') return; const d = dist2(x, player.p); if(d < bd){ bd = d; v = x; } });
  if(v) return {k:'node', v, t: v.status==='off' ? 'روشن کن' : (blockNo>=v.jail ? 'Unjail' : 'Jail\n'+fa(v.jail-blockNo)), wait: v.status==='jail' && blockNo<v.jail};
  let upq = null;
  for(const q of SLOTS){ const d = Math.hypot(player.p.x-q.x-.5, player.p.z-q.z-.5); if(d > 2.2) continue; const b = S.builds && S.builds[q.id];
    if(!b){ if(!slotsOpen()) continue; return {k:'slot', q, t:'ساخت'}; } if(b.done > Date.now()) return {k:'speed', q, t:'تسریع\n'+fa(speedCost(b))+' Gem'}; if(bLv(b) < BMAX && !upq) upq = q; }
  const R = S.fw ? 10 : 6.5; let tg = null; bd = R;
  if(LV.boss) LV.boss.nodes.forEach(n => { if(n.hp <= 0) return; const d = Math.hypot(n.x-player.p.x, n.z-player.p.z); if(d < 11 && d - 3 < bd){ bd = d - 3; tg = {node:n, x:n.x, z:n.z}; } });
  scammers.forEach(q => { const d = dist2(q.a.position, player.p); if(d < bd + 2){ bd = d - 2; tg = {sc:q, x:q.a.position.x, z:q.a.position.z}; } });
  hackers.forEach(h => { const d = dist2(h.a.position, player.p); if(d < bd + 2){ bd = d - 2; tg = {hk:h, x:h.x, z:h.z}; } });
  orbs.forEach(o => { if(o.type!=='scam') return; const d = dist2(o, player.p); if(d < bd){ bd = d; tg = {o, x:o.x, z:o.z}; } });
  if(tg) return {k:'scan', tg, t:'اسکن', warn:true};
  if(upq){ const b = S.builds[upq.id], c = upCost(b), tok = (S.tokens||0) > 0; return {k:'upg', q:upq, t:'ارتقا Lv'+fa(bLv(b)+1)+'\n'+(tok ? 'توکن' : big(c)), wait: !tok && S.tdoto < c}; }

  return null;
}
function doAction(){

}

function pathNext(T){

  pathCache.t = now; pathCache.tx = T.x; pathCache.tz = T.z; pathCache.wp = null;
  if(clearPath(player.p, T)) return T;
